<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Organic Synth Lab</title>
    <script type="module" crossorigin src="/sound-generator/assets/index-DYAH_po5.js"></script>
    <link rel="stylesheet" crossorigin href="/sound-generator/assets/index-CzGDXe9X.css">
  </head>
  <body>
    <div id="app"></div>

    <div id="ui-layer">
      <div class="control-group">
        <label>Waveform:</label>
        <select id="waveType">
          <option value="sine">Sine (標準)</option>
          <option value="square">Square (矩形波)</option>
          <option value="sawtooth">Sawtooth (のこぎり波)</option>
          <option value="triangle">Triangle (三角波)</option>
          <option value="custom">★MIC CAPTURE★</option>
        </select>
      </div>

      <div class="control-group">
        <label>Freq (Hz):</label>
        <input type="range" id="freq" min="110" max="880" step="1" value="440">
      </div>

      <div class="control-group">
        <label>Attack:</label>
        <input type="range" id="attack" min="0.01" max="1" step="0.01" value="0.1">
      </div>

      <div class="control-group">
        <label>Release:</label>
        <input type="range" id="release" min="0.01" max="2" step="0.01" value="0.5">
      </div>

      <hr style="border: 0.5px solid rgba(255,255,255,0.2); margin: 10px 0;">

      <button id="sampleBtn" style="background: #ff4e4e; margin-bottom: 8px;">
        1. CAPTURE FROM MIC
      </button>

      <button id="playBtn">
        2. PLAY SOUND
      </button>
      
      <p style="font-size: 10px; text-align: center; color: #ccc; margin-top: 5px;">
        ※マイク使用時は「許可」を押してください
      </p>
    </div>

  </body>
</html>
